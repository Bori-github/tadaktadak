appId: com.boriguri.tadaktadak
name: 배경음 안내 툴팁을 닫으면 다시 실행해도 표시하지 않는지 테스트
---
# 전제: 다른 플로우 뒤에 실행. `clearState`가 `pnpm e2e:ios`/`pnpm e2e:android`가 맞춘 저장값을 지움
- launchApp:
    clearState: true
# 아래 시각은 모두 실행 기준

# [마감 실행 +40s] 알림 권한 요청 팝업이 뜰 때까지
# `clearState`가 알림 권한도 초기화해 팝업이 툴팁을 가림. Maestro 자동 허용은 영어 버튼만 눌러서 직접 탭
- extendedWaitUntil:
    visible:
      text: '^(허용|Allow)$'
    timeout: 40000
    optional: true
- tapOn:
    text: '^(허용|Allow)$'
    optional: true

# [마감 실행 +40s] 스플래시가 끝나고 툴팁이 보일 때까지
- extendedWaitUntil:
    visible:
      id: 'ambient-sound-tooltip'
    timeout: 40000

# 툴팁 표시 중 탭은 툴팁만 닫고 재생 버튼은 동작하지 않음
# 화면 변화가 없다고 판단해 다시 탭하면 재생 버튼이 눌려서 재시도 끔
- tapOn:
    id: 'controls-play'
    retryTapIfNoChange: false
- assertNotVisible:
    id: 'ambient-sound-tooltip'
- assertVisible:
    id: 'controls-stop'
    enabled: false

- stopApp
- launchApp
# 아래 시각은 모두 재실행 기준

# [마감 재실행 +30s] 스플래시가 나타날 때까지
# 실행 직후에는 스플래시가 그려지기 전이라 사라짐 판정이 바로 통과함
- extendedWaitUntil:
    visible:
      id: 'splash'
    timeout: 30000
    optional: true
# [마감 재실행 +40s] 스플래시가 사라질 때까지
- extendedWaitUntil:
    notVisible:
      id: 'splash'
    timeout: 40000
# [마감 스플래시 종료 +5s] 툴팁이 그려질 시간을 둔 뒤 미표시 판정
- extendedWaitUntil:
    visible:
      id: 'ambient-sound-tooltip'
    timeout: 5000
    optional: true
- assertNotVisible:
    id: 'ambient-sound-tooltip'
