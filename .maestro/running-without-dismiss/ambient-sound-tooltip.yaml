appId: com.boriguri.tadaktadak
name: 타이머 진행 중에는 배경음 안내 툴팁을 표시하지 않고 정지하면 표시하는지 테스트
---
# 전제: 집중 타이머 진행 중이고 툴팁 닫기 기록이 없음. `pnpm e2e:ios`가 실행 전에 맞춤
- launchApp
# 아래 시각은 모두 실행 기준

# [마감 실행 +10s] 스플래시가 나타날 때까지
# 실행 직후에는 스플래시가 그려지기 전이라 사라짐 판정이 바로 통과함
- extendedWaitUntil:
    visible:
      id: 'splash'
    timeout: 10000
    optional: true
# [마감 실행 +20s] 스플래시가 사라질 때까지
- extendedWaitUntil:
    notVisible:
      id: 'splash'
    timeout: 20000

# [마감 실행 +20s] 저장값을 읽어 진행 세션이 살아날 때까지
- extendedWaitUntil:
    visible:
      id: 'controls-stop'
      enabled: true
    timeout: 20000

# [마감 스플래시 종료 +5s] 툴팁이 그려질 시간을 둔 뒤 미표시 판정
- extendedWaitUntil:
    visible:
      id: 'ambient-sound-tooltip'
    timeout: 5000
    optional: true
- assertNotVisible:
    id: 'ambient-sound-tooltip'

# 진행 중에는 `DismissLayer`가 없어 정지 버튼 탭이 그대로 전달됨
- tapOn:
    id: 'controls-stop'

# [마감 정지 +10s] 대기 상태가 되어 툴팁이 보일 때까지
- extendedWaitUntil:
    visible:
      id: 'ambient-sound-tooltip'
    timeout: 10000
