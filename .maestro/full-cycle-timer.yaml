appId: com.boriguri.tadaktadak
name: 집중/휴식 타이머를 모두 실행하는 전체 타이머 사이클
---
# 휴식 타이머가 0분이면 휴식 구간이 없어 실패
- launchApp
# controls-stop이라는 id를 가진 요소가 활성화된 상태로 화면에 보일 때까지 최대 10초 기다림
# 10초 안에 나타나지 않아도 실패로 판단하지 않고 다음 단계로 넘어감
- extendedWaitUntil:
    visible:
      id: 'controls-stop'
      enabled: true
    timeout: 10000
    optional: true
# controls-stop이 활성 상태로 보이면 탭하고, 비활성 상태거나 보이지 않으면 다음 단계로 넘어감(이전 실행이 남긴 세션 정리 버튼을 탭하여 세션 정리)
- runFlow:
    when:
      visible:
        id: 'controls-stop'
        enabled: true
    commands:
      - tapOn:
          id: 'controls-stop'
- tapOn:
    id: 'controls-play'
# 타이머가 10초 이하가 될때까지 기다림
- extendedWaitUntil:
    visible:
      id: 'remaining-seconds'
      text: '^([0-9]|10)$'
    # 집중 타이머가 1분이면 남은 초가 10에 닿는 데 50초
    # 집중 타이머가 100초를 넘으면 여기서 타임아웃
    timeout: 90000
# 남은 시간이 30~60초로 바뀌면 휴식 타이머 시작
# 위 단계에서 10초 이하를 기다리는 동안 집중 타이머를 지나가므로 30~60초 사이에 진입으로 휴식 타이머 시작
- extendedWaitUntil:
    visible:
      id: 'remaining-seconds'
      text: '^([3-5][0-9]|60)$'
    timeout: 30000
# 정지 버튼이 비활성화될 때까지 기다림(휴식 타이머 종료)
- extendedWaitUntil:
    visible:
      id: 'controls-stop'
      enabled: false
    # 휴식 타이머가 1분이면 정지 버튼이 비활성이 되는 데 60초
    # 휴식 타이머가 90초를 넘으면 여기서 타임아웃
    timeout: 90000
# 남은 시간이 더 이상 표시되지 않으면 통과
- assertNotVisible:
    id: 'remaining-seconds'
