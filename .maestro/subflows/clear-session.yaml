appId: com.boriguri.tadaktadak
name: 이전 실행이 남긴 세션 정리
---
# 이전 실행이 남긴 세션이 있으면 정지 버튼이 활성화됨
# 세션 복원이 늦게 반영될 수 있어 최대 10초 기다림
# 정리할 세션이 없으면 10초를 모두 기다린 뒤 실패 없이 넘어감
- extendedWaitUntil:
    visible:
      id: 'controls-stop'
      enabled: true
    timeout: 10000
    optional: true

# 정지 버튼이 활성 상태면 탭해서 이전 세션 정리
# when의 대기 한도(7초)도 launchApp 기준이라, 위에서 10초를 쓴 경우 바로 판단
- runFlow:
    when:
      visible:
        id: 'controls-stop'
        enabled: true
    commands:
      - tapOn:
          id: 'controls-stop'
