appId: com.boriguri.tadaktadak
name: 이전 실행이 남긴 세션 정리
---
# JS 번들 로드 전에는 뷰 계층에 `splash`가 없어 `notVisible`이 즉시 통과하므로 재생 버튼 렌더링부터 대기
# Android 개발 빌드는 Metro 번들 로드로 재생 버튼 렌더링까지 약 25초 소요
- extendedWaitUntil:
    visible:
      id: 'controls-play'
    timeout: 30000

# 스플래시가 떠 있는 동안에는 아래 탭이 스플래시에 막혀서 사라질 때까지 기다림
- extendedWaitUntil:
    notVisible:
      id: 'splash'
    timeout: 40000

# 이전 실행이 남긴 세션이 있으면 정지 버튼이 활성화됨
# 타임아웃 10초가 `launchApp` 기준이므로 앞 대기가 10초를 넘으면 대기 없이 1회만 조회
# 정리할 세션이 없으면 `optional`이라 실패 처리하지 않음
- extendedWaitUntil:
    visible:
      id: 'controls-stop'
      enabled: true
    timeout: 10000
    optional: true

# 정지 버튼이 활성 상태면 탭해서 이전 세션 정리
# when의 대기 한도(7초)도 launchApp 기준이라, 위에서 10초를 쓴 경우 바로 판단
- runFlow:
    when:
      visible:
        id: 'controls-stop'
        enabled: true
    commands:
      - tapOn:
          id: 'controls-stop'
