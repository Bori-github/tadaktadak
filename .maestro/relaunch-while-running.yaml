appId: com.boriguri.tadaktadak
name: 타이머 진행 중 앱을 닫고 다시 켜면 남은 시간이 이어지는지 테스트
---
# 전제: 앱 설정이 집중 60초. `pnpm e2e:ios`/`pnpm e2e:android`가 실행 전에 맞춤
- launchApp

- runFlow:
    file: subflows/clear-session.yaml

# 남은 시간이 매초 갱신되어 탭 후 UI 안정화 대기가 끝나지 않으므로 0.5초로 제한
- tapOn:
    id: 'controls-play'
    waitToSettleTimeoutMs: 500
# 아래 t는 모두 이 탭 시각(t=0) 기준

# [마감 t=30s] 집중 타이머 남은 시간이 45에서 50 사이가 될 때까지
# 한 값만 대기하면 화면을 조회하는 간격에 그 1초가 빠져 마감까지 대기하다 실패하므로 6초 범위로 지정
- extendedWaitUntil:
    visible:
      id: 'remaining-seconds'
      text: '^(4[5-9]|50)$'
    timeout: 30000
# `copyTextFrom`이 Android에서 최대 2.6초 소요되므로 호출 전후 시각의 중간값을 조회 시각으로 기록
- evalScript: ${output.readStartedAt = Date.now()}
- copyTextFrom:
    id: 'remaining-seconds'
- evalScript: ${output.killedSeconds = Number(maestro.copiedText)}
- evalScript: ${output.killedAt = (output.readStartedAt + Date.now()) / 2}

# 프로세스가 종료되어 메모리의 남은 시간이 사라짐. 재실행한 화면은 저장값에서만 계산
- stopApp
- launchApp

# [마감 재실행 +40s] 저장값을 읽어 진행 세션이 살아날 때까지
# 예상 통과: iOS 재실행 +7s, Android 재실행 +25s / 조건: 재실행이 t=60s 전에 끝나야 집중 타이머가 끝나기 전에 판정함
- extendedWaitUntil:
    visible:
      id: 'remaining-seconds'
    timeout: 40000
# 조회 시각 오차가 허용치를 넘으면 재조회
- retry:
    maxRetries: 2
    commands:
      - evalScript: ${output.readStartedAt = Date.now()}
      - copyTextFrom:
          id: 'remaining-seconds'
      - evalScript: ${output.readAt = (output.readStartedAt + Date.now()) / 2}
      # 재실행에 걸린 시간과 무관하게 판정하기 위해 실제로 흐른 시간으로 계산
      # 허용 오차 2초: 표시값 올림 1초 + 조회 시각 오차 1초
      - assertTrue: ${Math.abs(output.killedSeconds - (output.readAt - output.killedAt) / 1000 - Number(maestro.copiedText)) <= 2}

# 다음 플로우가 대기에서 시작하게 세션 정리
- tapOn:
    id: 'controls-stop'
