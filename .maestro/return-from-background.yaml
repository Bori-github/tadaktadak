appId: com.boriguri.tadaktadak
name: 백그라운드에서 집중 타이머가 끝난 뒤 돌아오면 휴식 타이머가 이어지는지 테스트
---
# 전제: 앱 설정이 집중 60초, 휴식 60초. `pnpm e2e:ios`/`pnpm e2e:android`가 실행 전에 맞춤
- launchApp

- runFlow:
    file: subflows/clear-session.yaml

# 남은 시간이 매초 갱신되어 탭 후 UI 안정화 대기가 끝나지 않으므로 0.5초로 제한
- tapOn:
    id: 'controls-play'
    waitToSettleTimeoutMs: 500
# 아래 t는 모두 이 탭 시각(t=0) 기준

# [마감 t=30s] 집중 타이머 남은 시간이 45에서 50 사이가 될 때까지
# `controls-play` 탭은 화면이 안정될 때까지 대기한 뒤 종료되므로, 탭 시각 대신 이 자리에서 `markedAt`을 기록
- extendedWaitUntil:
    visible:
      id: 'remaining-seconds'
      text: '^(4[5-9]|50)$'
    timeout: 30000
# `copyTextFrom`이 Android에서 최대 2.6초 소요되므로 호출 전후 시각의 중간값을 조회 시각으로 기록
- evalScript: ${output.readStartedAt = Date.now()}
- copyTextFrom:
    id: 'remaining-seconds'
- evalScript: ${output.markedSeconds = Number(maestro.copiedText)}
- evalScript: ${output.markedAt = (output.readStartedAt + Date.now()) / 2}

- pressKey: 'Home'

# 대기 명령이 없어, 화면에 없는 `never-shown`을 조회하게 두고 백그라운드에서 65초 대기
# 집중 타이머가 `markedAt` +50s 안에 끝나므로, 복귀 시점은 휴식 타이머가 15초 넘게 지난 자리
- extendedWaitUntil:
    visible:
      id: 'never-shown'
    timeout: 65000
    optional: true

- launchApp:
    stopApp: false

# [마감 복귀 +20s] 완료를 거쳐 휴식 타이머 진행으로 이어질 때까지
- extendedWaitUntil:
    visible:
      id: 'remaining-seconds'
    timeout: 20000

# 복귀 직후에는 `restoreRunningSession`이 값을 바꾸기 전이라 집중 타이머의 남은 시간이 남아 있음
# 갱신 전 값을 읽으면 판정이 어긋나므로 다시 읽음
- retry:
    maxRetries: 2
    commands:
      - evalScript: ${output.readStartedAt = Date.now()}
      - copyTextFrom:
          id: 'remaining-seconds'
      - evalScript: ${output.readAt = (output.readStartedAt + Date.now()) / 2}
      # 휴식 타이머는 `completedAt`부터 계산하므로, `markedSeconds`에 휴식 60초를 더하고 `markedAt` 이후로 흐른 시간을 뺌
      # 허용 오차 2초: 표시값 올림 1초 + 조회 시각 오차 1초
      - assertTrue: ${Math.abs(output.markedSeconds + 60 - (output.readAt - output.markedAt) / 1000 - Number(maestro.copiedText)) <= 2}

- assertVisible:
    id: 'controls-stop'
    enabled: true

# 다음 플로우가 대기에서 시작하게 세션 정리
- tapOn:
    id: 'controls-stop'
