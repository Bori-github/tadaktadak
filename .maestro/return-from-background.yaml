appId: com.boriguri.tadaktadak
name: 백그라운드에서 집중 타이머가 끝난 뒤 돌아오면 휴식 타이머가 이어지는지 테스트
---
# 전제: 앱 설정이 집중 60초, 휴식 60초 (이 플로우에서 설정하지 않음)
- launchApp

- runFlow:
    file: subflows/clear-session.yaml

- tapOn:
    id: 'controls-play'
# 아래 t는 모두 이 탭 시각(t=0) 기준

# [마감 t=30s] 집중 타이머 남은 시간이 50이 될 때까지
# `controls-play` 탭은 화면이 안정될 때까지 대기한 뒤 종료되므로, 탭 시각 대신 이 자리에서 `markedAt`을 기록
- extendedWaitUntil:
    visible:
      id: 'remaining-seconds'
      text: '^50$'
    timeout: 30000
- evalScript: ${output.markedAt = Date.now()}

- pressKey: 'Home'

# 대기 명령이 없어, 화면에 없는 `never-shown`을 조회하게 두고 백그라운드에서 65초 대기
# 집중 타이머가 `markedAt` +50s에 끝나므로, 복귀 시점은 휴식 타이머가 15초 지난 자리
- extendedWaitUntil:
    visible:
      id: 'never-shown'
    timeout: 65000
    optional: true

- launchApp:
    stopApp: false

# [마감 복귀 +20s] 완료를 거쳐 휴식 타이머 진행으로 이어질 때까지
- extendedWaitUntil:
    visible:
      id: 'remaining-seconds'
    timeout: 20000
- copyTextFrom:
    id: 'remaining-seconds'

# 휴식 타이머는 `completedAt`부터 계산하므로, 110초에서 `markedAt` 이후로 흐른 시간을 빼면 남은 시간
# 오차 2초는 표시 올림 1초와 값을 읽은 뒤 판정까지의 간격 1초
- assertTrue: ${Math.abs(110 - (Date.now() - output.markedAt) / 1000 - Number(maestro.copiedText)) <= 2}

- assertVisible:
    id: 'controls-stop'
    enabled: true

# 다음 플로우가 대기에서 시작하게 세션 정리
- tapOn:
    id: 'controls-stop'
