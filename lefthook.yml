pre-commit:
  jobs:
    - name: eslint
      glob: '*.{ts,tsx,js}'
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    - name: prettier
      glob: '*.{ts,tsx,js,json,md}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: typecheck
      run: pnpm exec tsc --noEmit

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
