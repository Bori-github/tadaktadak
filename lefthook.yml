pre-commit:
  jobs:
    - name: work-scope
      run: sh .lefthook/check-work-scope.sh commit

    - name: eslint
      glob: '*.{ts,tsx,js}'
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    - name: prettier
      glob: '*.{ts,tsx,js,json,md}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: typecheck
      run: pnpm exec tsc --noEmit

pre-push:
  jobs:
    - name: work-scope
      use_stdin: true
      run: sh .lefthook/check-work-scope.sh push

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
