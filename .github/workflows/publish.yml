name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-notes

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 태그 판정
        env:
          PUSHED: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version=$(jq -r .version package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json의 version이 X.Y.Z 형식이 아님: $version"
            exit 1
          fi

          # release 브랜치에서만 배포하므로 release 브랜치에 없는 커밋의 태그는 릴리즈 노트를 발행하지 않음
          if ! grep -q 'origin/release/' <<< "$(git branch -r --contains "$PUSHED")"; then
            echo "::error::${PUSHED}가 가리키는 커밋이 원격 release 브랜치에 없음"
            exit 1
          fi

          # 릴리즈 목록 조회 실패시 ::error::로 실패 원인을 남김
          if ! releases=$(gh release list --limit 100 --exclude-drafts --json tagName --jq '.[].tagName'); then
            echo "::error::릴리즈 목록 조회 실패"
            exit 1
          fi

          # 발행된 릴리즈가 없으면 Release Drafter가 빈 노트를 생성하므로 중단
          if [ -z "$releases" ]; then
            echo "::error::발행된 릴리즈 없음. 첫 릴리즈는 gh release create로 직접 생성"
            exit 1
          fi

          # 버전 형식 검사(예: v1.2.3, v1.2.3.4 외 허용하지 않음)
          지난릴리즈() {
            grep -E "^v${version//./\\.}(\.[0-9]+)?$" <<< "$releases" | sort -Vr || true
          }
          published=$(지난릴리즈 | head -1)

          # v{version} 형식의 릴리즈가 없으면 릴리즈 미발행으로 판단
          if [ -z "$published" ]; then
            expected="v$version"
          else
            previous=$(지난릴리즈 | grep -E "^v${version//./\\.}\.[0-9]+$" | head -1 || true)
            number=1
            if [ -n "$previous" ]; then
              number=$(( 10#${previous##*.} + 1 ))
            fi
            expected="v$version.$number"
          fi

          if [ "$PUSHED" != "$expected" ]; then
            echo "::error::푸시된 태그 $PUSHED. 다음 태그는 $expected"
            exit 1
          fi

          if [ -n "$published" ]; then
            if ! git rev-parse -q --verify "refs/tags/$published" > /dev/null; then
              echo "::error::$published 태그를 찾지 못함"
              exit 1
            fi
            if [ -z "$(git log "$published..HEAD" --oneline)" ]; then
              echo "::error::$published 이후 변경 없음"
              exit 1
            fi
          fi

      # 비교 대상을 태그 버전 미만(OTA 태그는 이하)의 최신 릴리즈로 제한
      - name: 비교 범위
        id: range
        run: |
          version=${GITHUB_REF_NAME#v}
          base=$(cut -d. -f1-3 <<< "$version")
          if [ "$version" = "$base" ]; then echo "range=<$base"; else echo "range=<=$base"; fi >> "$GITHUB_OUTPUT"

      - uses: release-drafter/release-drafter@v7
        with:
          filter-by-range: ${{ steps.range.outputs.range }}
          publish: true
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
