name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 태그 대조
        id: plan
        env:
          PUSHED: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Release Drafter는 발행된 릴리즈가 없으면 변경을 못 찾아 빈 노트를 낸다
          if [ -z "$(gh release list --limit 1 --json tagName --jq '.[].tagName')" ]; then
            echo "::error::발행된 릴리즈가 없음. 첫 릴리즈는 gh release create로 직접 만든다"
            exit 1
          fi

          version=$(jq -r .version package.json)

          # 순번 자리가 숫자 아닌 태그는 산술에서 bash 오류를 내므로 정규식으로 걸러냄
          지난태그() {
            git tag --list "v$version" "v$version.*" --sort=-v:refname |
              grep -E "^v${version//./\\.}(\.[0-9]+)?$" |
              grep -vx "$PUSHED" || true
          }
          published=$(지난태그 | head -1)

          # v{version} 계열 태그 부재는 해당 버전 스토어 릴리즈 미발행
          if [ -z "$published" ]; then
            expected="v$version"
            name="v$version"
          else
            previous=$(지난태그 | grep -E "\.[0-9]+$" | head -1 || true)
            number=1
            if [ -n "$previous" ]; then
              number=$(( ${previous##*.} + 1 ))
            fi
            expected="v$version.$number"
            name="$version 업데이트 $number"
          fi

          if [ "$PUSHED" != "$expected" ]; then
            echo "::error::푸시된 태그가 $PUSHED. 다음 태그는 ${expected}여야 함"
            exit 1
          fi

          if [ -n "$published" ] && [ -z "$(git log "$published..HEAD" --oneline)" ]; then
            echo "::error::$published 이후 변경 없음"
            exit 1
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: release-drafter/release-drafter@v7
        with:
          publish: true
          tag: ${{ github.ref_name }}
          name: ${{ steps.plan.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
