name: deploy-ios

on:
  workflow_dispatch: {}

jobs:
  fingerprint:
    type: fingerprint
    environment: production

  get_build:
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  update_ios:
    type: update
    needs: [get_build]
    if: ${{ needs.get_build.outputs.build_id }}
    params:
      platform: ios
      channel: production

  build_ios:
    type: build
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    params:
      platform: ios
      profile: production

  submit_ios:
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
